<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>index — Spatial AI Productivity Canvas</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body,
      #scene-container {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #hud-overlay {
        position: fixed;
        top: 18px;
        left: 18px;
        z-index: 10;
        pointer-events: none;
        max-width: 310px;
        padding: 16px 18px;
        border-radius: 16px;
        background: rgba(15, 23, 42, 0.78);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(56, 189, 248, 0.35);
        color: #f8fafc;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      }
      .brand-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
      }
      .brand-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #00d2ff;
        box-shadow: 0 0 10px #00d2ff;
      }
      .brand-title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .brand-sub {
        font-size: 12.5px;
        line-height: 1.45;
        color: #94a3b8;
        margin-bottom: 12px;
      }
      .controls-list {
        list-style: none;
        display: grid;
        gap: 6px;
        font-size: 12px;
        color: #cbd5e1;
      }
      .controls-list li {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      .key-badge {
        padding: 1px 7px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: #38bdf8;
        font-weight: 600;
        font-size: 11px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="hud-overlay">
      <div class="brand-row">
        <span class="brand-dot"></span>
        <span class="brand-title">index</span>
      </div>
      <p class="brand-sub">
        Voice-to-3D spatial workspace powered by Groq AI. Click <strong>Enter XR</strong> to begin.
      </p>
      <ul class="controls-list">
        <li><span>Speak tasks</span><span class="key-badge">Trigger Orb / Space</span></li>
        <li><span>AI micro-tip</span><span class="key-badge">Click 💡 TIP</span></li>
        <li><span>Sort columns</span><span class="key-badge">Organize / Enter</span></li>
        <li><span>Passthrough</span><span class="key-badge">Room / B</span></li>
      </ul>
    </div>

    <div id="scene-container"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
